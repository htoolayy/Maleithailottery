<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-6">

    <!-- အပိုင်း (၁) - ထီလက်မှတ် တင်သွင်းရန် -->
    <div class="bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700">
      <h1 class="text-xl font-bold text-center text-amber-400 mb-1">ထီလက်မှတ် စာရင်းသွင်းမည်</h1>
      <p class="text-xs text-slate-400 text-center mb-4">နံပါတ်ရိုက်ထည့်ပြီး ဓာတ်ပုံရိုက်တင်ပါ</p>

      <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] mb-4 flex items-center justify-center border-2 border-slate-600">
        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
        <div class="absolute inset-0 border-2 border-amber-400/40 m-4 rounded-lg pointer-events-none flex items-center justify-center">
          <span class="text-xs text-amber-200/80 bg-black/60 px-2.5 py-1 rounded">ထီလက်မှတ်ကို ဘောင်ထဲ ချိန်ပါ</span>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">ထီလက်မှတ် အမျိုးအစား:</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center justify-center p-3 rounded-xl border border-slate-600 cursor-pointer bg-slate-700/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-400/10">
              <input type="radio" name="ticket_price" value="15000" class="hidden" checked>
              <div class="text-center">
                <div class="font-bold text-sm text-white">၁ စောင်တွဲ</div>
                <div class="text-xs text-amber-400 font-mono">15,000 Ks</div>
              </div>
            </label>
            <label class="flex items-center justify-center p-3 rounded-xl border border-slate-600 cursor-pointer bg-slate-700/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-400/10">
              <input type="radio" name="ticket_price" value="30000" class="hidden">
              <div class="text-center">
                <div class="font-bold text-sm text-white">၂ စောင်တွဲ</div>
                <div class="text-xs text-amber-400 font-mono">30,000 Ks</div>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">ထီနံပါတ် (၆ လုံး):</label>
          <input type="text" id="ticket-number" maxlength="6" inputmode="numeric" placeholder="ဂဏန်း ၆ လုံး ရိုက်ပါ" 
                 class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-center tracking-widest text-amber-300 focus:outline-none focus:border-amber-400">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="startCamera()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl text-sm transition">
            📷 ကင်မရာ ဖွင့်
          </button>
          <button onclick="captureAndUpload()" id="btn-upload" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm shadow transition">
            🚀 ဓာတ်ပုံတင်မည်
          </button>
        </div>

        <div id="status-msg" class="text-xs text-center font-medium py-2 px-3 rounded-lg hidden"></div>
      </div>
    </div>

    <!-- အပိုင်း (၂) - Admin စစ်ဆေးမည့် အော်ဒါများစာရင်း -->
    <div class="bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-sky-400 flex items-center gap-1.5">
          📋 စစ်ဆေးရန် အော်ဒါများ
        </h2>
        <button onclick="loadPendingOrders()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg">
          🔄 Refresh
        </button>
      </div>

      <div id="orders-list" class="space-y-4">
        <div class="text-center text-xs text-slate-400 py-4">အော်ဒါများ ခေါ်ယူနေပါသည်...</div>
      </div>
    </div>

  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ticketInput = document.getElementById('ticket-number');
    const statusMsg = document.getElementById('status-msg');
    const btnUpload = document.getElementById('btn-upload');
    let stream = null;

    async function startCamera() {
      try {
        if (stream) stream.getTracks().forEach(track => track.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        showStatus('ကင်မရာ ဖွင့်မရပါ: ' + err.message, 'bg-red-900/60 text-red-300');
      }
    }

    async function captureAndUpload() {
      const ticketNum = ticketInput.value.trim();
      const selectedPrice = document.querySelector('input[name="ticket_price"]:checked').value;

      if (!ticketNum || ticketNum.length !== 6) {
        showStatus('ထီနံပါတ် ၆ လုံး ပြည့်စုံစွာ ရိုက်ထည့်ပေးပါ', 'bg-red-900/70 text-red-200');
        return;
      }
      if (!video.videoWidth) {
        showStatus('ကင်မရာ အရင်ဖွင့်ပေးပါ', 'bg-amber-900/70 text-amber-200');
        return;
      }

      btnUpload.disabled = true;
      btnUpload.innerText = 'တင်သွင်းနေပါသည်...';

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('ticket_number', ticketNum);
        formData.append('price', selectedPrice);
        formData.append('ticket_image', blob, `${ticketNum}.jpg`);

        try {
          const res = await fetch('/api/admin/auto-upload', { method: 'POST', body: formData });
          const result = await res.json();
          if (result.success) {
            showStatus(`လက်မှတ် [${ticketNum}] တင်ပြီးပါပြီ!`, 'bg-emerald-900/80 text-emerald-200');
            ticketInput.value = '';
          } else {
            showStatus('တင်၍ မရပါ: ' + (result.error || 'အမှားရှိပါသည်'), 'bg-red-900/60 text-red-300');
          }
        } catch (err) {
          showStatus('ချိတ်ဆက်မှု အမှားဖြစ်နေပါသည်', 'bg-red-900/60 text-red-300');
        } finally {
          btnUpload.disabled = false;
          btnUpload.innerText = '🚀 ဓာတ်ပုံတင်မည်';
        }
      }, 'image/jpeg', 0.85);
    }

    async function loadPendingOrders() {
      const container = document.getElementById('orders-list');
      try {
        const res = await fetch('/api/admin/pending-orders?t=' + Date.now());
        const orders = await res.json();
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
          container.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">လတ်တလော စစ်ဆေးရန် အော်ဒါမရှိသေးပါ</div>';
          return;
        }

        orders.forEach(order => {
          const price = order.tickets?.price ? Number(order.tickets.price).toLocaleString() : '15,000';
          const typeStr = order.tickets?.price === 30000 ? '၂ စောင်တွဲ' : '၁ စောင်တွဲ';

          const card = document.createElement('div');
          card.className = 'bg-slate-700/60 border border-slate-600 rounded-xl p-4 text-sm space-y-3';
          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-600 pb-2">
              <span class="font-mono font-bold text-amber-300">${order.id}</span>
              <span class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded font-bold">${price} Ks (${typeStr})</span>
            </div>

            <div class="text-xs space-y-1">
              <div>ထီနံပါတ်: <b class="text-white text-base tracking-widest font-mono">${order.ticket_number}</b></div>
              <div>ဝယ်သူ Telegram: <b class="text-sky-300">${order.telegram_chat_id}</b></div>
            </div>

            <!-- ပုံများ ကြည့်ရှုစစ်ဆေးရန် အကွက် -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <a href="${order.slip_image_url}" target="_blank" class="block bg-slate-800 p-2 rounded-lg text-center hover:bg-slate-900 border border-slate-600">
                <span class="text-[11px] text-amber-400 block mb-1">📄 ငွေလွှဲစလစ်</span>
                <img src="${order.slip_image_url}" class="h-20 w-full object-cover rounded">
              </a>
              <a href="${order.ticket_image_url}" target="_blank" class="block bg-slate-800 p-2 rounded-lg text-center hover:bg-slate-900 border border-slate-600">
                <span class="text-[11px] text-emerald-400 block mb-1">🎟️ ထီလက်မှတ်</span>
                <img src="${order.ticket_image_url}" class="h-20 w-full object-cover rounded">
              </a>
            </div>

            <!-- ဓာတ်ပုံအစစ်အား Share ပို့မည့် ခလုတ် -->
            <button onclick="shareTicketPhoto('${order.ticket_image_url}', '${order.ticket_number}')" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5">
              <span>📲</span> ဓာတ်ပုံအစစ်ကို Telegram သို့ Share ပို့မည်
            </button>

            <!-- ပို့ပြီးစီးကြောင်း အတည်ပြုခလုတ် -->
            <button onclick="markAsDelivered('${order.id}', '${order.ticket_id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
              ✅ ပို့ပြီးပါပြီ (Order အပြီးသတ်မည်)
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<div class="text-center text-xs text-rose-400 py-2">အော်ဒါများ ဆွဲမရပါ</div>';
      }
    }

    // ဓာတ်ပုံအစစ် (File) ကို Telegram သို့ တိုက်ရိုက် Share ပို့ပေးသည့် Function
    async function shareTicketPhoto(imageUrl, ticketNumber) {
      try {
        const res = await fetch(imageUrl);
        const blob = await res.blob();
        const file = new File([blob], `Ticket_${ticketNumber}.jpg`, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `ထိုင်းထီလက်မှတ် - ${ticketNumber}`,
            text: `ထိုင်းထီလက်မှတ်နံပါတ်: ${ticketNumber}\nကံထူးပါစေခင်ဗျာ!`
          });
        } else {
          // Share မရပါက ပုံကို Save လုပ်နိုင်ရန် ဖွင့်ပေးခြင်း
          window.open(imageUrl, '_blank');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function markAsDelivered(orderId, ticketId) {
      if (!confirm(`Order [${orderId}] အား ပို့ဆောင်ပြီးစီးကြောင်း အတည်ပြုမည် သေချာပါသလား?`)) return;

      try {
        const res = await fetch('/api/admin/complete-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id: orderId, ticket_id: ticketId })
        });
        const result = await res.json();
        if (result.success) {
          alert('အော်ဒါပြီးစီးကြောင်း အတည်ပြုပြီးပါပြီ!');
          loadPendingOrders();
        }
      } catch (err) {
        alert('အမှားဖြစ်နေပါသည်');
      }
    }

    function showStatus(text, classes) {
      statusMsg.className = `text-xs text-center font-medium py-2 px-3 rounded-lg ${classes}`;
      statusMsg.innerText = text;
      statusMsg.classList.remove('hidden');
    }

    window.addEventListener('load', () => {
      startCamera();
      loadPendingOrders();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ထီလက်မှတ် တင်သွင်းရန်</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700">
    <h1 class="text-xl font-bold text-center text-amber-400 mb-1">ထီလက်မှတ် စာရင်းသွင်းမည်</h1>
    <p class="text-xs text-slate-400 text-center mb-4">နံပါတ်ရိုက်ထည့်ပြီး ဓာတ်ပုံရိုက်တင်ပါ</p>

    <!-- ကင်မရာ Viewfinder -->
    <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] mb-4 flex items-center justify-center border-2 border-slate-600">
      <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div class="absolute inset-0 border-2 border-amber-400/40 m-4 rounded-lg pointer-events-none flex items-center justify-center">
        <span class="text-xs text-amber-200/80 bg-black/60 px-2.5 py-1 rounded">ထီလက်မှတ်ကို ဘောင်ထဲ ချိန်ပါ</span>
      </div>
    </div>

    <div class="space-y-4">
      <!-- စျေးနှုန်းနှင့် အတွဲ ရွေးချယ်ခြင်း -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ထီလက်မှတ် အမျိုးအစား ရွေးပါ:</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center justify-center p-3 rounded-xl border border-slate-600 cursor-pointer bg-slate-700/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-400/10">
            <input type="radio" name="ticket_price" value="15000" class="hidden" checked>
            <div class="text-center">
              <div class="font-bold text-sm text-white">၁ စောင်တွဲ</div>
              <div class="text-xs text-amber-400 font-mono">15,000 Ks</div>
            </div>
          </label>
          <label class="flex items-center justify-center p-3 rounded-xl border border-slate-600 cursor-pointer bg-slate-700/50 has-[:checked]:border-amber-400 has-[:checked]:bg-amber-400/10">
            <input type="radio" name="ticket_price" value="30000" class="hidden">
            <div class="text-center">
              <div class="font-bold text-sm text-white">၂ စောင်တွဲ</div>
              <div class="text-xs text-amber-400 font-mono">30,000 Ks</div>
            </div>
          </label>
        </div>
      </div>

      <!-- ထီနံပါတ် ရိုက်ထည့်ရန်နေရာ -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ထီနံပါတ် (၆ လုံး):</label>
        <input type="text" id="ticket-number" maxlength="6" inputmode="numeric" placeholder="ဂဏန်း ၆ လုံး ရိုက်ပါ" 
               class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-center tracking-widest text-amber-300 focus:outline-none focus:border-amber-400 placeholder:text-sm placeholder:font-normal placeholder:tracking-normal">
      </div>

      <!-- ခလုတ်များ -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="startCamera()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl text-sm transition">
          📷 ကင်မရာ ပြန်ဖွင့်
        </button>
        <button onclick="captureAndUpload()" id="btn-upload" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm shadow transition">
          🚀 ဓာတ်ပုံရိုက်ပြီး တင်မည်
        </button>
      </div>

      <div id="status-msg" class="text-xs text-center font-medium py-2 px-3 rounded-lg hidden"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ticketInput = document.getElementById('ticket-number');
    const statusMsg = document.getElementById('status-msg');
    const btnUpload = document.getElementById('btn-upload');
    let stream = null;

    async function startCamera() {
      try {
        if (stream) stream.getTracks().forEach(track => track.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        showStatus('ကင်မရာ အသင့်ဖြစ်ပါပြီ', 'bg-blue-900/60 text-blue-300');
      } catch (err) {
        showStatus('ကင်မရာ ဖွင့်မရပါ: ' + err.message, 'bg-red-900/60 text-red-300');
      }
    }

    async function captureAndUpload() {
      const ticketNum = ticketInput.value.trim();
      const selectedPrice = document.querySelector('input[name="ticket_price"]:checked').value;

      if (!ticketNum || ticketNum.length !== 6) {
        showStatus('ထီနံပါတ် ၆ လုံး ပြည့်စုံစွာ ရိုက်ထည့်ပေးပါခင်ဗျာ', 'bg-red-900/70 text-red-200');
        return;
      }

      if (!video.videoWidth) {
        showStatus('ကင်မရာ ပွင့်မနေပါ၊ ကင်မရာဖွင့်ခလုတ်ကို အရင်နှိပ်ပေးပါ', 'bg-amber-900/70 text-amber-200');
        return;
      }

      btnUpload.disabled = true;
      btnUpload.innerText = 'တင်သွင်းနေပါသည်...';
      showStatus('ဓာတ်ပုံနှင့် စာရင်း သိမ်းဆည်းနေပါသည်...', 'bg-blue-900/60 text-blue-300');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('ticket_number', ticketNum);
        formData.append('price', selectedPrice);
        formData.append('ticket_image', blob, `${ticketNum}.jpg`);

        try {
          const res = await fetch('/api/admin/auto-upload', {
            method: 'POST',
            body: formData
          });
          const result = await res.json();

          if (result.success) {
            showStatus(`လက်မှတ် [${ticketNum}] (${Number(selectedPrice).toLocaleString()} Ks) အောင်မြင်စွာ တင်ပြီးပါပြီ!`, 'bg-emerald-900/80 text-emerald-200');
            ticketInput.value = '';
          } else {
            showStatus('တင်၍ မရပါ: ' + (result.error || 'အမှားရှိနေပါသည်'), 'bg-red-900/60 text-red-300');
          }
        } catch (err) {
          showStatus('ချိတ်ဆက်မှု အမှားဖြစ်နေပါသည်', 'bg-red-900/60 text-red-300');
        } finally {
          btnUpload.disabled = false;
          btnUpload.innerText = '🚀 ဓာတ်ပုံရိုက်ပြီး တင်မည်';
        }
      }, 'image/jpeg', 0.85);
    }

    function showStatus(text, classes) {
      statusMsg.className = `text-xs text-center font-medium py-2 px-3 rounded-lg ${classes}`;
      statusMsg.innerText = text;
      statusMsg.classList.remove('hidden');
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>

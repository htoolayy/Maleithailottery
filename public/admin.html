<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ထီလက်မှတ် စာရင်းသွင်းစနစ်</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto bg-slate-800 rounded-2xl shadow-xl p-5 border border-slate-700">
    <h1 class="text-xl font-bold text-center text-amber-400 mb-1">Admin Panel</h1>
    <p class="text-xs text-slate-400 text-center mb-4">ထီလက်မှတ် ဓာတ်ပုံရိုက်၍ တိုက်ရိုက်တင်သွင်းခြင်း</p>

    <!-- ကင်မရာ ပြသမည့် နေရာ -->
    <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] mb-4 flex items-center justify-center border-2 border-dashed border-slate-600">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div id="cam-overlay" class="absolute inset-0 border-2 border-amber-400/50 m-4 rounded-lg pointer-events-none flex items-center justify-center">
        <span class="text-xs text-amber-200/70 bg-black/50 px-2 py-1 rounded">ထီလက်မှတ်ကို ဘောင်ထဲ အံဝင်အောင် ချိန်ပါ</span>
      </div>
    </div>

    <!-- ထိန်းချုပ်ခလုတ်များနှင့် အချက်အလက် -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">ထီနံပါတ် (၆ လုံး):</label>
        <input type="text" id="ticket-number" maxlength="6" placeholder="ဥပမာ - 597284" 
               class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-lg font-mono font-bold text-center tracking-widest text-amber-300 focus:outline-none focus:border-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="startCamera()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl text-sm transition">
          📷 ကင်မရာ ဖွင့်မည်
        </button>
        <button onclick="captureAndUpload()" id="btn-upload" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm shadow transition">
          🚀 ဓာတ်ပုံရိုက်ပြီး တင်မည်
        </button>
      </div>

      <div id="status-msg" class="text-xs text-center font-medium mt-2 py-1.5 px-3 rounded-lg hidden"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ticketInput = document.getElementById('ticket-number');
    const statusMsg = document.getElementById('status-msg');
    const btnUpload = document.getElementById('btn-upload');
    let stream = null;

    // ကင်မရာ စတင်ဖွင့်ခြင်း
    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        showStatus('ကင်မရာ အသင့်ဖြစ်ပါပြီ', 'bg-blue-900/60 text-blue-300');
      } catch (err) {
        showStatus('ကင်မရာ ဖွင့်မရပါ: ' + err.message, 'bg-red-900/60 text-red-300');
      }
    }

    // ဓာတ်ပုံ Capture လုပ်ပြီး Server သို့ တင်ပို့ခြင်း
    async function captureAndUpload() {
      const ticketNum = ticketInput.value.trim();
      if (!ticketNum || ticketNum.length !== 6) {
        showStatus('ထီနံပါတ် ၆ လုံး ပြည့်စုံစွာ ရိုက်ထည့်ပေးပါ', 'bg-red-900/60 text-red-300');
        return;
      }

      if (!video.videoWidth) {
        showStatus('ကင်မရာကို အရင်ဖွင့်ထားပေးပါ', 'bg-amber-900/60 text-amber-300');
        return;
      }

      btnUpload.disabled = true;
      btnUpload.innerText = 'တင်သွင်းနေပါသည်...';
      showStatus('ဓာတ်ပုံ သိမ်းဆည်းနေပါသည်...', 'bg-blue-900/60 text-blue-300');

      // Frame ကို ဓာတ်ပုံအဖြစ် Capture လုပ်ခြင်း
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('ticket_number', ticketNum);
        formData.append('ticket_image', blob, `${ticketNum}.jpg`);

        try {
          const res = await fetch('/api/admin/auto-upload', {
            method: 'POST',
            body: formData
          });
          const result = await res.json();

          if (result.success) {
            showStatus(`လက်မှတ် [${ticketNum}] အောင်မြင်စွာ တင်ပြီးပါပြီ!`, 'bg-emerald-900/60 text-emerald-300');
            ticketInput.value = '';
          } else {
            showStatus('တင်၍ မရပါ: ' + (result.error || 'Server error'), 'bg-red-900/60 text-red-300');
          }
        } catch (err) {
          showStatus('ချိတ်ဆက်မှု အမှားဖြစ်နေပါသည်', 'bg-red-900/60 text-red-300');
        } finally {
          btnUpload.disabled = false;
          btnUpload.innerText = '🚀 ဓာတ်ပုံရိုက်ပြီး တင်မည်';
        }
      }, 'image/jpeg', 0.85);
    }

    function showStatus(text, classes) {
      statusMsg.className = `text-xs text-center font-medium mt-2 py-1.5 px-3 rounded-lg ${classes}`;
      statusMsg.innerText = text;
      statusMsg.classList.remove('hidden');
    }

    // စာမျက်နှာ စဖွင့်သည်နှင့် ကင်မရာ အလိုအလျောက် ဖွင့်ရန်
    window.addEventListener('load', startCamera);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အွန်လိုင်း ထိုင်းထီ အရောင်း</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 text-white text-center">
      <h1 class="text-2xl font-black tracking-wide">🇲🇲 ထိုင်းထီ အရောင်း 🇹🇭</h1>
      <p class="text-xs text-blue-100 mt-1">အွန်လိုင်းမှ စိတ်ကြိုက်နံပါတ် ရွေးချယ်ဝယ်ယူနိုင်ပါသည်</p>
    </div>

    <div class="p-4 md:p-5">
      <!-- ရောင်းရန်ရှိသော ထီလက်မှတ်များ -->
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-800">ရွေးချယ်နိုင်သော ထီလက်မှတ်များ</h2>
        <span class="text-xs text-slate-400">နံပါတ်ကို နှိပ်၍ ဝယ်ယူပါ</span>
      </div>

      <div id="tickets-container" class="grid grid-cols-2 gap-3 mb-6">
        <div class="col-span-2 text-center text-slate-400 py-6 text-sm">လက်မှတ်များ ရှာဖွေနေပါသည်...</div>
      </div>

      <!-- ဝယ်ယူမှု အချက်အလက်ဖောင် (လက်မှတ်နှိပ်မှ ပေါ်မည်) -->
      <div id="checkout-box" class="hidden border-t-2 border-dashed border-slate-200 pt-5 space-y-4">
        
        <!-- ရွေးထားသော ထီလက်မှတ် အကျဉ်းချုပ် -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3.5 space-y-1.5 text-xs text-slate-700">
          <div class="flex justify-between items-center text-sm font-bold">
            <span class="text-slate-600">ထီနံပါတ်:</span>
            <span id="selected-ticket-num" class="text-blue-700 font-mono text-lg tracking-widest"></span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-600">အမျိုးအစား:</span>
            <span id="selected-ticket-type" class="font-semibold text-slate-800"></span>
          </div>
          <div class="flex justify-between items-center text-sm font-bold pt-1 border-t border-blue-100">
